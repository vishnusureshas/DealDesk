name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc -p dealdesk/tsconfig.json --noEmit
          npx tsc -p billport/tsconfig.json --noEmit

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.DEALDESK_API_URL || 'https://dealdesk-api-ys6i.onrender.com' }}
          VITE_SOCKET_URL: ${{ vars.DEALDESK_API_URL || 'https://dealdesk-api-ys6i.onrender.com' }}
          VITE_GIT_SHA: ${{ github.sha }}

  deploy:
    name: Deploy (Render + Vercel + verify)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://deal-desk-blond-psi.vercel.app' }}
      DEALDESK_API_URL: ${{ vars.DEALDESK_API_URL || 'https://dealdesk-api-ys6i.onrender.com' }}
      BILLPORT_API_URL: ${{ vars.BILLPORT_API_URL || 'https://dealdesk-billport-78wi.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Render deploy (dealdesk)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_DEALDESK" ]; then echo 'skip: no hook configured (relying on auto-deploy)'; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_DEALDESK"
        env:
          RENDER_DEPLOY_HOOK_DEALDESK: ${{ secrets.RENDER_DEPLOY_HOOK_DEALDESK }}

      - name: Trigger Render deploy (billport)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_BILLPORT" ]; then echo 'skip: no hook configured (relying on auto-deploy)'; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BILLPORT"
        env:
          RENDER_DEPLOY_HOOK_BILLPORT: ${{ secrets.RENDER_DEPLOY_HOOK_BILLPORT }}

      - name: Trigger Vercel deploy (frontend)
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then echo 'skip: no hook configured (relying on auto-deploy)'; exit 0; fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Wait for deploys to land (commit SHA match)
        run: |
          set -e
          TARGET="${GITHUB_SHA:0:12}"
          echo "target commit: $TARGET"
          for i in $(seq 1 36); do
            be_commit=$(curl -s "$DEALDESK_API_URL/health" | python3 -c "import sys,json; print((json.load(sys.stdin).get('commit') or '')[:12])" 2>/dev/null || echo "")
            bp_commit=$(curl -s "$BILLPORT_API_URL/health" | python3 -c "import sys,json; print((json.load(sys.stdin).get('commit') or '')[:12])" 2>/dev/null || echo "")
            fe_html=$(curl -s "$FRONTEND_URL/" || echo "")
            fe_commit=$(echo "$fe_html" | grep -o 'name="app-commit" content="[^"]*"' | sed 's/.*content="//;s/"//' | cut -c1-12)
            echo "attempt $i: dealdesk=$be_commit billport=$bp_commit frontend=$fe_commit (target=$TARGET)"
            # Frontend (Vercel) rebuilds on every push -> must match exactly.
            # Backends (Render) only rebuild when their code changes; otherwise
            # their commit must be an ancestor of (or equal to) the target.
            be_ok=false; bp_ok=false
            if [ -n "$be_commit" ] && git merge-base --is-ancestor "$be_commit" "$GITHUB_SHA" 2>/dev/null; then be_ok=true; fi
            if [ -n "$bp_commit" ] && git merge-base --is-ancestor "$bp_commit" "$GITHUB_SHA" 2>/dev/null; then bp_ok=true; fi
            if [ "$fe_commit" = "$TARGET" ] && [ "$be_ok" = "true" ] && [ "$bp_ok" = "true" ]; then
              echo "frontend is live at $TARGET; backends are at-or-before target (dealdesk=$be_commit billport=$bp_commit)"
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for deploys to land"; exit 1
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify backend health endpoints
        run: |
          set -e
          echo "== dealdesk /health =="
          curl -fsS "$DEALDESK_API_URL/health"; echo
          echo "== dealdesk /health/seed =="
          curl -fsS "$DEALDESK_API_URL/health/seed"; echo
          echo "== billport /health =="
          curl -fsS "$BILLPORT_API_URL/health"; echo
          # deployed backend commits must be at-or-before the pushed commit
          be_commit=$(curl -s "$DEALDESK_API_URL/health" | python3 -c "import sys,json; print((json.load(sys.stdin).get('commit') or '')[:12])")
          bp_commit=$(curl -s "$BILLPORT_API_URL/health" | python3 -c "import sys,json; print((json.load(sys.stdin).get('commit') or '')[:12])")
          test -n "$be_commit" && git merge-base --is-ancestor "$be_commit" "$GITHUB_SHA"
          test -n "$bp_commit" && git merge-base --is-ancestor "$bp_commit" "$GITHUB_SHA"
          echo "backend commits ok: dealdesk=$be_commit billport=$bp_commit (target ${GITHUB_SHA:0:12})"

      - name: Verify frontend (Vercel)
        run: |
          set -e
          code=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/")
          echo "root -> $code"; test "$code" = "200"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/login")
          echo "/login -> $code"; test "$code" = "200"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/deals")
          echo "/deals -> $code"; test "$code" = "200"
          # confirm the deployed bundle is the pushed commit
          fe_commit=$(curl -s "$FRONTEND_URL/" | grep -o 'name="app-commit" content="[^"]*"' | sed 's/.*content="//;s/"//' | cut -c1-12)
          target="${GITHUB_SHA:0:12}"
          echo "deployed frontend commit: $fe_commit (target: $target)"
          test "$fe_commit" = "$target"